<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Éditeur de reprises de dressage</title>
  <link rel="stylesheet" href="style.css?v=2026111208">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">Reprises de dressage</div>
    <div class="status">
      <div id="current" class="current" title="Allure et déplacement en cours"></div>
      <span class="info" tabindex="0" aria-label="Aide sur l’outil en cours">i<span id="hint" class="hint-pop" role="tooltip"></span></span>
    </div>
    <div class="file-actions">
      <button id="btn-new" title="Commencer une reprise vierge">Nouvelle</button>
      <button id="btn-open" title="Ouvrir une reprise enregistrée sur l'ordinateur">Ouvrir…</button>
      <button id="btn-save" title="Enregistrer la reprise sur l'ordinateur">Enregistrer</button>
      <select id="page-orient" title="Orientation des pages imprimées et du PDF">
        <option value="paysage">Page paysage</option>
        <option value="portrait">Page portrait</option>
      </select>
      <button id="btn-print" title="Imprimer sur feuilles A4">Imprimer</button>
      <button id="btn-pdf" title="Télécharger la reprise en PDF (A4 paysage)">Exporter en PDF</button>
      <button id="btn-full" title="Plein écran">⛶ Plein écran</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="layout">
    <aside class="toolbar no-print" aria-label="Outils">
      <div class="group">
        <span class="label">Outil</span>
        <div id="tools" class="icons5"></div>
        <div id="diam-group"><div id="diams" class="diams"></div></div>
      </div>
      <div class="group">
        <span class="label">Allure</span>
        <div id="gaits" class="gaitgrid"></div>
        <div id="gaits-x" class="gaitx"></div>
      </div>
      <div class="group">
        <span class="label">Déplacement</span>
        <div id="moves" class="icons5"></div>
      </div>
      <div class="group">
        <span class="label">Figure</span>
        <div id="symbols" class="icons5"></div>
      </div>
      <div class="group">
        <span class="label">Matériel</span>
        <div id="gear" class="icons5"></div>
      </div>
      <div class="group">
        <span class="label">Taille des symboles <span id="sym-scale-val">100 %</span></span>
        <input type="range" id="sym-scale" min="0.5" max="2" step="0.05" value="1" title="Double-clic : taille normale">
      </div>
      <label class="toggle"><input type="checkbox" id="snap" checked> Accrocher aux lettres</label>
    </aside>

    <main>
      <div class="title-row">
        <input id="title" class="title" placeholder="Titre de la reprise" autocomplete="off">
        <span id="total-len" class="total" title="Longueur totale de tous les déplacements de toutes les figures"></span>
      </div>
      <div id="legend" class="legend print-only"></div>
      <div id="cases" class="cases"></div>
    </main>
  </div>

  <!-- Flèches de direction (une par allure) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="markers"></defs></svg>

  <script src="app.js?v=2026111208"></script>
</body>
</html>
